{% extends "base.html" %}
{% block content %}
<nav>
    <ul><li><strong>Entrenando: {{ rutina.nombre }}</strong></li></ul>
    <ul>
        <li><span id="timer" style="font-size: 1.2rem; font-weight: bold; color: var(--primary);">00:00</span></li>
        <li><a href="{{ url_for('rutinas.index') }}" class="secondary" onclick="return confirm('¿Seguro que quieres salir?');">Cancelar</a></li>
    </ul>
</nav>

<form id="form-entrenamiento" action="{{ url_for('rutinas.finalizar', oid_rutina=rutina.__oid__) }}" method="POST">
    <input type="hidden" name="duracion" id="duracion_input" value="00:00">
    
    <div id="entrenamiento-container">
        {% for ej in ejercicios %}
        <article id="card-{{ ej.oid }}">
            <header><h4>{{ ej.nombre }}</h4></header>
            <div id="series-{{ ej.oid }}"></div>
            <button type="button" class="outline" onclick="addSerie('{{ ej.oid }}')">+ Añadir Serie</button>
        </article>
        {% endfor %}
    </div>

    <hr>
    <div style="background: var(--card-background-color); padding: 15px; border-radius: 10px; margin-bottom: 20px;">
        <label><strong>¿Añadir ejercicio al entrenamiento?</strong></label>
        <div class="grid">
            <select id="sel-ej">
                <option value="">-- Selecciona del catálogo --</option>
                {% for c in catalogo %}
                <option value="{{ c.__oid__ }}">{{ c.nombre }}</option>
                {% endfor %}
            </select>
            <button type="button" onclick="addEjercicio()">Añadir</button>
            <button type="button" class="secondary outline" onclick="document.getElementById('modal-nuevo-ejercicio').showModal()">✨ Crear nuevo</button>
        </div>
    </div>

    <button type="submit" style="background-color: #388e3c; border: none; width: 100%;">🏁 Finalizar Entrenamiento</button>
</form>

<dialog id="modal-nuevo-ejercicio">
  <article>
    <header>
      <a href="#close" aria-label="Close" class="close" onclick="document.getElementById('modal-nuevo-ejercicio').close()"></a>
      <h5>Crear nuevo ejercicio para el catálogo</h5>
    </header>
    <label>Nombre
        <input type="text" id="modal-nombre" placeholder="Ej: Press Militar">
    </label>
    <label>Grupo Muscular
        <select id="modal-grupo">
            <option value="Pecho">Pecho</option>
            <option value="Espalda">Espalda</option>
            <option value="Pierna">Pierna</option>
            <option value="Brazos">Brazos</option>
            <option value="Core">Core</option>
        </select>
    </label>
    <footer>
      <button class="secondary" onclick="document.getElementById('modal-nuevo-ejercicio').close()">Cancelar</button>
      <button onclick="guardarEjercicioAjax()">Guardar y Añadir</button>
    </footer>
  </article>
</dialog>

<script>
// FUNCIÓN PARA GUARDAR POR AJAX
async function guardarEjercicioAjax() {
    const nombre = document.getElementById('modal-nombre').value;
    const grupo = document.getElementById('modal-grupo').value;

    if (!nombre) { alert("El nombre es obligatorio"); return; }

    const response = await fetch("{{ url_for('ejercicios.crear_ajax') }}", {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nombre: nombre, grupo_muscular: grupo })
    });

    if (response.ok) {
        const data = await response.json();
        // 1. Añadirlo a la interfaz de entrenamiento
        renderNuevoEjercicio(data.oid, data.nombre);
        // 2. Añadirlo al selector por si quiere añadirlo otra vez luego
        const sel = document.getElementById('sel-ej');
        const opt = document.createElement('option');
        opt.value = data.oid;
        opt.text = data.nombre;
        sel.add(opt);
        // 3. Cerrar modal y limpiar
        document.getElementById('modal-nuevo-ejercicio').close();
        document.getElementById('modal-nombre').value = "";
    } else {
        alert("Error al guardar el ejercicio");
    }
}

function renderNuevoEjercicio(id, nombre) {
    const html = `
        <article id="card-${id}" style="margin-bottom: 20px;">
            <header><h4>${nombre}</h4></header>
            <div id="series-${id}"></div>
            <button type="button" class="outline" onclick="addSerie('${id}')">+ Añadir Serie</button>
        </article>`;
    document.getElementById('entrenamiento-container').insertAdjacentHTML('beforeend', html);
    addSerie(id); // Añadimos la primera serie automáticamente
}

function addSerie(id) {
    const container = document.getElementById(`series-${id}`);
    const num = container.children.length + 1;
    const div = document.createElement('div');
    div.className = "grid serie-row";
    div.style.cssText = "align-items: center; margin-bottom: 10px;";
    div.innerHTML = `<strong class="num-serie">S${num}</strong>
        <input type="number" step="0.5" name="peso_${id}[]" placeholder="Kg" style="margin-bottom:0;">
        <input type="number" name="reps_${id}[]" placeholder="Reps" style="margin-bottom:0;">
        <button type="button" class="secondary outline" onclick="this.parentElement.remove(); recalcularNumeros(document.getElementById('series-${id}'))" style="margin-bottom:0;">X</button>`;
    container.appendChild(div);
}

function recalcularNumeros(contenedor) {
    const filas = contenedor.querySelectorAll('.num-serie');
    filas.forEach((el, index) => { el.innerText = `S${index + 1}`; });
}

function addEjercicio() {
    const sel = document.getElementById('sel-ej');
    const id = sel.value;
    const nombre = sel.options[sel.selectedIndex].text;
    if(!id) return;
    if(document.getElementById(`card-${id}`)) { alert("Ya está en la lista"); return; }
    renderNuevoEjercicio(id, nombre);
    sel.value = "";
}

// Cronómetro
let s = 0;
setInterval(() => {
    s++;
    let txt = `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
    document.getElementById('timer').innerText = txt;
    document.getElementById('duracion_input').value = txt;
}, 1000);

// Cargamos series iniciales para ejercicios que ya vinieran en la rutina
window.onload = () => {
    {% for ej in ejercicios %}
    addSerie('{{ ej.oid }}');
    {% endfor %}
};
</script>
{% endblock %}
