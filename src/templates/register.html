{% extends "base.html" %}
{% block content %}
<div style="display: flex; justify-content: center; align-items: center; min-height: 80vh;">
    <div class="card" style="width: 100%; max-width: 380px; padding: 24px;">
        <div style="text-align: center; margin-bottom: 24px;">
            <i class="ti ti-user-plus" style="font-size: 48px; color: var(--accent);"></i>
            <h2 style="margin-top: 10px; margin-bottom: 5px;">Únete a la red</h2>
            <p class="text-faint">Crea tu cuenta para registrar tus entrenamientos</p>
        </div>

        <form action="{{ url_for('auth.register') }}" method="POST" style="display: flex; flex-direction: column; gap: 16px;">
            <div>
                <label for="username">Usuario</label>
                <input type="text" name="username" id="username" placeholder="Elige un nombre único" required>
            </div>
            <div>
                <label for="password">Contraseña</label>
                <input type="password" name="password" id="password" placeholder="Mínimo 6 caracteres" required>
            </div>
            
            <button type="submit" class="btn-primary" style="margin-top: 8px; width: 100%;">
                Comenzar viaje <i class="ti ti-arrow-right"></i>
            </button>
        </form>

        <div style="text-align: center; margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--bg-border);">
            <p class="text-faint" style="margin-bottom: 12px;">¿Ya eres miembro?</p>
            <a href="{{ url_for('auth.login') }}" class="btn-ghost" style="display: block; width: 100%; text-align: center;">
                Inicia sesión aquí
            </a>
        </div>
    </div>
</div>
{% endblock %}
