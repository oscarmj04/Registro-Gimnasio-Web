{% extends "base.html" %}
{% block content %}
<div style="max-width: 600px; margin: 0 auto; width: 100%;">
    <div style="margin-bottom: 20px;">
        <a href="{{ url_for('rutinas.index') }}" class="text-faint" style="display: flex; align-items: center; gap: 4px;">
            <i class="ti ti-arrow-left"></i> Volver a Rutinas
        </a>
    </div>

    <header style="margin-bottom: 24px;">
        <h2 style="margin: 0;">Editar Rutina</h2>
        <p class="text-faint" style="margin: 5px 0 0 0;">Modifica los ejercicios de tu rutina.</p>
    </header>

    <form action="{{ url_for('rutinas.actualizar', oid_rutina=rutina.__oid__) }}" method="POST" style="display: flex; flex-direction: column; gap: 20px;">
        
        <div class="card">
            <label for="nombre">Nombre de la Rutina</label>
            <input type="text" name="nombre" id="nombre" value="{{ rutina.nombre }}" required>
        </div>

        <div>
            <h3 style="font-size: 14px; margin-bottom: 12px; color: var(--text-secondary);">Selecciona los ejercicios</h3>
            <div class="card" style="max-height: 400px; overflow-y: auto; padding: 0;">
                {% for ej in catalogo %}
                <label style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--bg-border); margin: 0; cursor: pointer;">
                    <input type="checkbox" name="ejercicios_seleccionados" value="{{ ej.__oid__ }}" 
                           {% if ej.__oid__|string in rutina.lista_ejercicios_oids %}checked{% endif %}
                           style="width: 18px; height: 18px; margin: 0;">
                    
                    <div style="display: flex; flex-direction: column;">
                        <span style="color: var(--text-primary); font-size: 14px;">{{ ej.nombre }}</span>
                        <span class="text-faint" style="font-size: 11px;">{{ ej.grupo_muscular }}</span>
                    </div>
                </label>
                {% endfor %}
            </div>
        </div>

        <button type="submit" class="btn-primary" style="width: 100%; padding: 12px; font-size: 14px;">
            <i class="ti ti-device-floppy"></i> Guardar Cambios
        </button>
    </form>
</div>
{% endblock %}
