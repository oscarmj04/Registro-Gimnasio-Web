{% extends "base.html" %}
{% block content %}

<div style="max-width: 600px; margin: 0 auto; width: 100%; padding-bottom: 80px;">
    <div style="margin-bottom: 20px;">
        <a href="{{ url_for('rutinas.index') }}" class="text-faint" style="display: flex; align-items: center; gap: 4px;">
            <i class="ti ti-arrow-left"></i> Volver a Rutinas
        </a>
    </div>

    <header style="margin-bottom: 24px;">
        <h2 style="margin: 0;">Editar Rutina</h2>
        <p class="text-faint" style="margin: 5px 0 0 0;">Configura tu rutina arrastrando y añadiendo ejercicios.</p>
    </header>

    <form action="{{ url_for('rutinas.actualizar', oid_rutina=rutina.__oid__) }}" method="POST">
        <div class="card" style="margin-bottom: 20px;">
            <label>Nombre de la Rutina</label>
            <input type="text" name="nombre" value="{{ rutina.nombre }}" required>
        </div>

        <div id="lista-ejercicios" style="display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px;">
            {% for ej in ejercicios %}
            {% set eid = ej.__oid__|string %}
            <article class="card" id="card-{{ eid }}" style="border-left: 3px solid var(--accent); display: flex; align-items: center; gap: 12px;">
                <i class="ti ti-grip-vertical drag-handle" style="cursor: grab; color: var(--text-faint);"></i>
                <div style="flex-grow: 1;">
                    <h4 style="margin: 0; font-size: 15px;">{{ ej.nombre }}</h4>
                    <span class="text-faint" style="font-size: 11px;">{{ ej.grupo_muscular }}</span>
                </div>
                <input type="hidden" name="ejercicios_seleccionados" value="{{ eid }}">
                <button type="button" class="btn-ghost" onclick="this.closest('.card').remove()" style="color: var(--warning);">
                    <i class="ti ti-trash"></i>
                </button>
            </article>
            {% endfor %}
        </div>

        <div class="card-inner" style="margin-top: 20px; margin-bottom: 20px;">
            <label style="margin-bottom: 12px; display: block;">Añadir ejercicio</label>
            <div style="display: flex; flex-direction: column; gap: 12px;">
                <div style="display: flex; gap: 8px;">
                    <select id="sel-ej" style="flex-grow: 1;">
                        <option value="">-- Catálogo --</option>
                        {% for c in catalogo %}
                        <option value="{{ c.__oid__ }}">{{ c.nombre }}</option>
                        {% endfor %}
                    </select>
                    <button type="button" class="btn-secondary" onclick="addEjercicio()">Añadir</button>
                </div>
            </div>
        </div>

        <button type="submit" class="btn-primary" style="width: 100%; padding: 14px;">Guardar Cambios</button>
    </form>
</div>

<dialog id="modal-nuevo-ejercicio">
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
      <h5 style="margin: 0; font-size: 16px;">Nuevo Ejercicio</h5>
      <button class="btn-ghost" style="padding: 4px; border: none;" onclick="document.getElementById('modal-nuevo-ejercicio').close()"><i class="ti ti-x"></i></button>
  </div>
  <div style="display: flex; flex-direction: column; gap: 16px; margin-bottom: 24px;">
      <input type="text" id="modal-nombre" placeholder="Nombre">
      <select id="modal-grupo">
          <option value="Pecho">Pecho</option><option value="Espalda">Espalda</option>
          <option value="Pierna">Pierna</option><option value="Brazos">Brazos</option>
          <option value="Core">Core</option>
      </select>
  </div>
  <button class="btn-primary" style="width: 100%;" onclick="guardarEjercicioAjax()">Guardar</button>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
<script>
    new Sortable(document.getElementById('lista-ejercicios'), { animation: 150, handle: '.drag-handle' });

    function addEjercicio() {
        const sel = document.getElementById('sel-ej');
        if(!sel.value) return;
        const nombre = sel.options[sel.selectedIndex].text;
        const html = `
            <article class="card" id="card-${sel.value}" style="border-left: 3px solid var(--accent); display: flex; align-items: center; gap: 12px;">
                <i class="ti ti-grip-vertical drag-handle" style="cursor: grab; color: var(--text-faint);"></i>
                <div style="flex-grow: 1;">
                    <h4 style="margin: 0; font-size: 15px;">${nombre}</h4>
                </div>
                <input type="hidden" name="ejercicios_seleccionados" value="${sel.value}">
                <button type="button" class="btn-ghost" onclick="this.closest('.card').remove()" style="color: var(--warning);"><i class="ti ti-trash"></i></button>
            </article>`;
        document.getElementById('lista-ejercicios').insertAdjacentHTML('beforeend', html);
    }

    async function guardarEjercicioAjax() {
        const nombre = document.getElementById('modal-nombre').value;
        const grupo = document.getElementById('modal-grupo').value;
        const response = await fetch("{{ url_for('ejercicios.crear_ajax') }}", {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ nombre: nombre, grupo_muscular: grupo })
        });
        if (response.ok) {
            const data = await response.json();
            const sel = document.getElementById('sel-ej');
            sel.add(new Option(data.nombre, data.oid));
            document.getElementById('modal-nuevo-ejercicio').close();
        }
    }
</script>
{% endblock %}
